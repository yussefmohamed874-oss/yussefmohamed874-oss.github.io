<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B1A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جيم Women Health">
<title>جيم Women Health</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--navy:#0B1A4A;--purple:#5B1FA8;--gold:#FFD400;--bg:#F4F3EE;--card:#fff;--ink:#141413;--mut:#6b6a63;--line:#E8E6DC;--red:#D92D20;--green:#0E9F6E;--amber:#D97706;--wa:#25D366}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Zain,Tahoma,sans-serif;color:var(--ink);font-size:18px;min-height:100vh;padding-bottom:110px}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hdr{background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 16px;position:sticky;top:0;z-index:5}
.hdr .row{display:flex;align-items:center;gap:10px}
.hdr h1{font-size:25px;font-weight:900;flex:1;line-height:1.2}
.hdr .sub{font-size:15px;opacity:.8}
.back{font-size:26px;color:#fff;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.search{width:100%;border:0;border-radius:14px;padding:12px 14px;font-size:18px;margin-top:12px;background:#fff;color:var(--ink);outline:none}
main{padding:14px;max-width:640px;margin:auto}
.mic-wrap{text-align:center;margin:10px 0 18px}
.mic{width:116px;height:116px;border-radius:50%;background:var(--gold);font-size:52px;box-shadow:0 0 0 12px rgba(255,212,0,.25),0 0 0 24px rgba(255,212,0,.1);display:inline-grid;place-items:center}
.mic-wrap b{display:block;margin-top:16px;font-size:20px;font-weight:900;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;padding:10px 4px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);width:100%}
.stat b{display:block;font-size:30px;font-weight:900;line-height:1.1}
.stat span{font-size:14px;color:var(--mut);font-weight:700}
.tile{background:var(--card);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:right;width:100%;margin-bottom:10px}
.tile .ic{font-size:24px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile b{font-weight:800;font-size:19px;line-height:1.2}
.tile .n{margin-inline-start:auto;font-weight:900;font-size:20px;color:var(--navy)}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card .top{display:flex;align-items:flex-start;gap:8px}
.card .nm{font-weight:900;font-size:20px;flex:1}
.card .ph{font-size:17px;color:var(--navy);font-weight:700;direction:ltr;display:inline-block}
.card .pr{color:var(--mut);font-size:16px;margin-top:3px}
.badge{font-size:14px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap}
.b-act{background:#E3F6EC;color:#0E7A50}.b-soon{background:#FFF1D6;color:#B45309}.b-exp{background:#FDE7E5;color:#B42318}.b-none{background:#eee;color:#777}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:13px;padding:1px 9px;border-radius:20px;font-weight:800}
.dates{font-size:16px;font-weight:700;margin-top:6px;color:var(--navy)}
.acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.acts a,.acts button{flex:1;text-align:center;padding:8px 6px;border-radius:11px;font-weight:800;font-size:16px;text-decoration:none;white-space:nowrap}
.a-wa{background:var(--wa);color:#fff}.a-call{background:#E8ECFA;color:var(--navy)}.a-ed{background:#eee;color:#333}.a-go{background:var(--navy);color:var(--gold)}.a-rn{background:#FFF6CC;color:#8a6d00}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:18px}
.fab{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);background:var(--gold);color:var(--navy);font-weight:900;font-size:20px;padding:14px 22px;border-radius:30px;box-shadow:0 6px 18px rgba(91,31,168,.35);z-index:6}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:16px;white-space:nowrap}
.chip.on{border-color:var(--purple);background:#F1EAFB;color:var(--purple)}
.lbl{font-size:15px;font-weight:800;color:var(--mut);margin:12px 2px 5px}
.inp{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:18px;outline:none}
.inp:focus{border-color:var(--purple)}
.inp.flash{animation:fl 1.4s}
@keyframes fl{0%,60%{background:#FFF6CC;border-color:var(--gold)}}
textarea.inp{min-height:70px;resize:vertical;line-height:1.5}
.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
.voice{background:#F1EAFB;border-radius:16px;padding:12px;margin-bottom:6px}
.voice .top{display:flex;align-items:center;gap:12px}
.vbtn{width:64px;height:64px;border-radius:50%;background:var(--gold);font-size:30px;flex:none;box-shadow:0 0 0 7px rgba(255,212,0,.25)}
.vbtn.rec{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(217,45,32,.15)}}
.voice .hint{font-size:15px;color:var(--purple);font-weight:700;line-height:1.4}
.voice textarea{margin-top:10px;background:#fff}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;text-align:center;border-radius:14px;padding:14px;font-weight:900;font-size:20px;margin-top:16px}
.btn.sec{background:#eee;color:#333;font-size:17px;padding:11px;margin-top:8px}
.btn.del{background:#FFF1F0;color:var(--red);font-size:17px;padding:11px;margin-top:8px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 90px);left:50%;transform:translateX(-50%);background:var(--navy);color:var(--gold);padding:10px 18px;border-radius:14px;font-weight:800;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.warn{background:#FFF6CC;border-radius:14px;padding:10px 12px;font-weight:700;font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.warn button{background:var(--navy);color:var(--gold);padding:6px 12px;border-radius:10px;font-weight:800;margin-inline-start:auto;white-space:nowrap}
.foot{text-align:center;margin-top:8px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.foot button,.foot a{color:var(--purple);font-weight:800;font-size:16px;padding:8px;text-decoration:none}
.sec-t{font-size:17px;font-weight:900;color:var(--navy);margin:14px 4px 8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.cell b{font-size:24px;font-weight:900;color:var(--navy)}
.cell span{font-size:12px;color:var(--mut);font-weight:700;line-height:1.2;max-height:2.4em;overflow:hidden;width:100%}
.cell.on{border-color:var(--gold);background:#FFFBE6}
.cell.on b{color:var(--purple)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#ddd}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:grid;place-items:center;overflow:auto}
.ov img{max-width:100%;max-height:100%;touch-action:pinch-zoom}
.vid{margin-bottom:10px;background:#fff;border-radius:14px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.vid video,.vid iframe{width:100%;border-radius:10px;background:#000;display:block;aspect-ratio:16/9;border:0}
.vid .vx{display:block;margin:8px auto 0;color:var(--red);font-weight:800;font-size:15px;padding:4px 10px}
.li{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;width:100%;text-align:right}
.li b{font-weight:800;font-size:18px;flex:1}
.vb{font-size:14px;font-weight:800;padding:3px 10px;border-radius:20px;background:#E3F6EC;color:#0E7A50;white-space:nowrap}
.vb.no{background:#eee;color:#888}
.addbar{display:flex;gap:8px;margin-bottom:12px}.addbar .inp{flex:1}.addbar button{background:var(--navy);color:var(--gold);font-weight:900;padding:0 18px;border-radius:12px}
.nav2{display:flex;gap:8px;margin-top:16px}.nav2 button{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== إعدادات =====
const PLANS=[{id:'1',name:'شهر',m:1},{id:'3',name:'3 شهور',m:3},{id:'6',name:'6 شهور',m:6},{id:'12',name:'سنة',m:12},{id:'x',name:'تاني',m:0}];
const PLAN=id=>PLANS.find(p=>p.id===id);
const MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

// ===== التخزين =====
const KEY='gy_v1',PKEY='gy_prog20_v1',PRKEY='gy_prices_v1';
function ld(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}}
const LKEY='gy_lib_v1';

else LIB=ld(LKEY,[]);
const saveLib=()=>localStorage.setItem(LKEY,JSON.stringify(LIB));
if(localStorage.getItem('gy_seed3')!=='1'){
 for(const g of ['زومبا','إيروبكس'])for(let i=1;i<=10;i++){const n=g+' '+i;if(!LIB.some(x=>x.type==='ex'&&x.name===n))LIB.push({id:uid0(),type:'ex',group:g,name:n,notes:'',videos:[]})}
 localStorage.setItem('gy_seed3','1');saveLib();
}
if(localStorage.getItem('gy_seed4')!=='1'){
 const add4=(g,names)=>names.forEach(n=>{if(!LIB.some(x=>x.type==='ex'&&x.name===n))LIB.push({id:uid0(),type:'ex',group:g,name:n,notes:'',videos:[]})});
 add4('البطن',Array.from({length:10},(_,i)=>'تمرين بطن '+(i+1)));
 add4('تسخين قبل التمرين',['مشي خفيف أو بايسكل (5 دقايق)','دوران الرقبة والأكتاف','دوران المعصم والكوع','دوران الوسط والورك','تحريك الكاحل والركبة','ركبة عالية (High Knees)','جامبينج جاك','سكوات بوزن الجسم','لانجز بوزن الجسم','سحب الذراع وفتح الصدر']);
 add4('تهدئة بعد التمرين',['مشي هادي لتهدئة النبض','تنفس عميق (شهيق وزفير)','إطالة الفخذ بعد التمرين','إطالة الأرداف بعد التمرين','إطالة الظهر بعد التمرين','إطالة الصدر والأكتاف بعد التمرين','فوم رولر للاسترخاء']);
 localStorage.setItem('gy_seed4','1');saveLib();
}
if(localStorage.getItem('gy_seed7')!=='1'){
 for(const n of ['كرانش','ريفرس كرانش'])if(!LIB.some(x=>x.type==='ex'&&x.name===n))LIB.push({id:uid0(),type:'ex',group:'البطن',name:n,notes:'',videos:[]});
 localStorage.setItem('gy_seed7','1');saveLib();
}

 for(const n of ['بايسكل كرانش','ليج ريز'])if(!LIB.some(x=>x.type==='ex'&&x.name===n))LIB.push({id:uid0(),type:'ex',group:'البطن',name:n,notes:'',videos:[]});
 localStorage.setItem('gy_seed8','1');saveLib();
}
if(localStorage.getItem('gy_seed9')!=='1'){
 for(const [g,n] of [['البطن','بلانك على الكوعين'],['البطن','بلانك جانبي'],['البطن','بلانك لمس الكتف'],['الصدر','ضغط على الركبة']])if(!LIB.some(x=>x.type==='ex'&&x.name===n))LIB.push({id:uid0(),type:'ex',group:g,name:n,notes:'',videos:[]});
 localStorage.setItem('gy_seed9','1');saveLib();
}
if(localStorage.getItem('gy_seed10')!=='1'){
 for(const n of ['جلوت بريدج','دونكي كيك'])if(!LIB.some(x=>x.type==='ex'&&x.name===n))LIB.push({id:uid0(),type:'ex',group:'الأرداف والفخذين',name:n,notes:'',videos:[]});
 localStorage.setItem('gy_seed10','1');saveLib();

 for(const n of ['كلام شيل','فاير هايدرانت'])if(!LIB.some(x=>x.type==='ex'&&x.name===n))LIB.push({id:uid0(),type:'ex',group:'الأرداف والفخذين',name:n,notes:'',videos:[]});
 localStorage.setItem('gy_seed11','1');saveLib();

if(localStorage.getItem('gy_seed12')!=='1'){
 if(!LIB.some(x=>x.type==='ex'&&x.name==='سايد ليج ريز'))LIB.push({id:uid0(),type:'ex',group:'الأرداف والفخذين',name:'سايد ليج ريز',notes:'',videos:[]});
 localStorage.setItem('gy_seed12','1');saveLib();

 if(!LIB.some(x=>x.type==='ex'&&x.name==='بايسبس كيرل بدمبل'))LIB.push({id:uid0(),type:'ex',group:'الذراعين',name:'بايسبس كيرل بدمبل',notes:'',videos:[]});
 localStorage.setItem('gy_seed13','1');saveLib();

if(localStorage.getItem('gy_seed14')!=='1'){
 for(const [g,n] of [['كارديو وحرق دهون','جامبينج جاك'],['كارديو وحرق دهون','ركبة عالية']])if(!LIB.some(x=>x.type==='ex'&&x.name===n))LIB.push({id:uid0(),type:'ex',group:g,name:n,notes:'',videos:[]});
 localStorage.setItem('gy_seed14','1');saveLib();

if(localStorage.getItem('gy_seed15')!=='1'){
 for(const [g,n] of [['إطالات','إطالة الصدر والأكتاف'],['إطالات','تنفس عميق']])if(!LIB.some(x=>x.type==='ex'&&x.name===n))LIB.push({id:uid0(),type:'ex',group:g,name:n,notes:'',videos:[]});

if(localStorage.getItem('gy_seed16')!=='1'){
 for(const [g,n] of [['الأرداف والفخذين','سكوات بوزن الجسم'],['البطن','ماونتن كلايمبر'],['البطن','روسيان تويست'],['إطالات','إطالة الظهر (وضعية الطفل)'],['إطالات','إطالة الظهر العلوي (عناق الذراعين)']])if(!LIB.some(x=>x.type==='ex'&&x.name===n))LIB.push({id:uid0(),type:'ex',group:g,name:n,notes:'',videos:[]});
 localStorage.setItem('gy_seed16','1');saveLib();

 for(const n of ['كيك باك ترايسبس بدمبل','دبس'])if(!LIB.some(x=>x.type==='ex'&&x.name===n))LIB.push({id:uid0(),type:'ex',group:'الذراعين',name:n,notes:'',videos:[]});
 localStorage.setItem('gy_seed17','1');saveLib();

if(localStorage.getItem('gy_seed6')!=='1'){

 if(!LIB.some(x=>x.name==='الكريزي (Crazy Fit)'))LIB.push({id:uid0(),type:'eq',group:'',name:'الكريزي (Crazy Fit)',notes:'',videos:[]});
 localStorage.setItem('gy_seed5','1');saveLib();

 if(!LIB.some(x=>x.type==='eq'&&x.name.includes('ستيب')))LIB.push({id:uid0(),type:'eq',group:'',name:'ستيبات (Step)',notes:'',videos:[]});
 localStorage.setItem('gy_seed2','1');saveLib();
}
let DB=ld(KEY,[]),PG=ld(PKEY,{}),PR=ld(PRKEY,{});
const save=()=>localStorage.setItem(KEY,JSON.stringify(DB));
const savePG=()=>localStorage.setItem(PKEY,JSON.stringify(PG));

async function idbOp(mode,fn){const d=await idb;return new Promise((res,rej)=>{const t=d.transaction('i',mode);const rq=fn(t.objectStore('i'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})}

function status(p){
 if(p.kind==='inq')return null;

const NUMW={'صفر':0,'زيرو':0,'واحد':1,'واحده':1,'اتنين':2,'اثنين':2,'تلاته':3,'ثلاثه':3,'اربعه':4,'خمسه':5,'سته':6,'سبعه':7,'تمانيه':8,'ثمانيه':8,'تمنيه':8,'تسعه':9,'عشره':10};
const PW={'الف وخمسميه':1500,'الفين':2000,'الف':1000,'ميتين':200,'تلتميه':300,'اربعميه':400,'خمسميه':500,'ستميه':600,'سبعميه':700,'تمانميه':800,'تسعميه':900,'ميه':100};
const MONTHS={'يناير':1,'فبراير':2,'مارس':3,'ابريل':4,'مايو':5,'يونيو':6,'يوليو':7,'اغسطس':8,'سبتمبر':9,'اكتوبر':10,'نوفمبر':11,'ديسمبر':12};
const WD=[[/(^|\s)(ال)?احد(\s|$)/,0],[/(^|\s)(ال)?(اتنين|اثنين)(\s|$)/,1],[/(^|\s)(ال)?(تلات|ثلاثاء|تلاتاء)(\s|$)/,2],[/(^|\s)(ال)?(اربع|اربعاء)(\s|$)/,3],[/(^|\s)(ال)?خميس(\s|$)/,4],[/(^|\s)(ال)?جمعه(\s|$)/,5],[/(^|\s)(ال)?سبت(\s|$)/,6]];
const STOP=['رقم','رقمه','رقمها','تليفون','تليفونه','تليفونها','موبايل','بتسال','بتستفسر','استفسار','عايزه','عاوزه','اشتراك','اشتركت','مشتركه','مشترك','عميله','جديده','جديد','بدات','بدايه','دفعت','سعر','قيمه','برنامج','في','من','و','اسمها','اسم','الاسم'];
const PLANW=/^(شهر|شهرين|شهور|اشهر|سنه|سنوي|ربع|نص|نصف)$/;
function parseGym(raw){
 const out={};
 const R=digits(raw).replace(/ـ/g,'').replace(/[،,؛.!?؟]/g,' , ').split(/\s+/).filter(Boolean);
 const N=R.map(x=>{const k=normAr(x);if(k in NUMW)return String(NUMW[k]);if(k[0]==='و'&&k.slice(1) in NUMW)return 'و'+NUMW[k.slice(1)];return k});
 const back=ph=>{const pt=ph.trim().split(/\s+/);for(let i=0;i+pt.length<=N.length;i++){if(pt.every((w,j)=>N[i+j]===w||(j===0&&['ال','لل','بال'].some(x=>N[i]===x+w))))return R.slice(i,i+pt.length).join(' ')}return ph};
 let t=' '+N.join(' ')+' ';
 // التليفون
 const cands=t.match(/\+?\d[\d\s\-]{6,}\d/g)||[];
 for(const c of cands){
  const d=c.replace(/\D/g,'');
  const m=d.match(/^(?:0020|20|0)?(1[0125]\d{8})/);
  if(m){out.phone='0'+m[1];let cnt=0,i=0;while(i<c.length&&cnt<m[0].length){if(/\d/.test(c[i]))cnt++;i++}t=t.replace(c,' , '+c.slice(i));break}
  if(d.length>=7&&d.length<=11){out.phone=d;t=t.replace(c,' , ');break}
 }
 // النوع
 if(/(بتسال|بتستفسر|استفسار|عايزه تعرف|بتسال)/.test(t))out.kind='inq';
 // البرنامج
 const pg=t.match(/برنامج\s*(?:رقم\s*)?(\d{1,2})(?!\d)/);
 if(pg&&+pg[1]>=1&&+pg[1]<=20){out.program=pg[1];t=t.replace(pg[0],' , ')}
 // المدة
 let m=null;const mm=t.match(/(\d{1,2})\s*(?:شهور|اشهر|شهر)/);
 if(mm)m=+mm[1];
 else if(/شهرين/.test(t))m=2;
 else if(/(?:ثلاث|تلات)\s*(?:شهور|اشهر)|ربع سنه/.test(t))m=3;
 else if(/(?:ست|سته)\s*(?:شهور|اشهر)|نص سنه|نصف سنه/.test(t))m=6;
 else if(/(سنه|سنوي|عام)/.test(t))m=12;
 else if(/(^|\s)شهر(\s|$)/.test(t))m=1;
 if(m){out.months=m;out.plan=[1,3,6,12].includes(m)?String(m):'x';if(!out.kind)out.kind='sub'}
 // السعر
 const pm=t.match(/(?:سعر|سعره|قيمه|قيمته|بسعر|دفعت|ب)\s*(\d{3,6})(?!\d)/)||t.match(/(\d{3,6})\s*(?:جنيه|جنية)/);
 if(pm){out.price=pm[1];t=t.replace(pm[0],' , ')}
 else{const pw=t.match(/(?:سعر|سعره|قيمه|بسعر|دفعت|ب)\s*(الف وخمسميه|الفين|الف|ميتين|تلتميه|اربعميه|خمسميه|ستميه|سبعميه|تمانميه|تسعميه|ميه)(?=\s|$)/);if(pw){out.price=String(PW[pw[1]]);t=t.replace(pw[0],' , ')}}
 if(out.price&&!out.kind)out.kind='sub';
 // الاسم
 const nm=t.match(/(?:اسمها|اسمه|الاسم)\s+([^\s,\d]+(?:\s+[^\s,\d]+){0,2})/);
 const cand=nm?nm[1]:(t.trim().split(',')[0]||'').trim();
 if(cand){const ws=[];for(const w of cand.split(/\s+/)){if(!w)continue;if(/\d/.test(w)||PLANW.test(w))break;if(STOP.includes(w)){if(ws.length)break;continue}ws.push(w);if(ws.length===3)break}
  if(ws.length)out.name=back(ws.join(' '))}
 // تاريخ البدء
 const now=new Date();let date=null;
 if(/بعد بكر/.test(t)){date=new Date();date.setDate(date.getDate()+2)}
 else if(/(بكره|بكرا)/.test(t)){date=new Date();date.setDate(date.getDate()+1)}
 else if(/(النهارده|النهارد|اليوم)/.test(t))date=new Date();
 else{
  const md=t.match(/(\d{1,2})\s*(?:\/|-)\s*(\d{1,2})(?!\d)/);
  const mn=t.match(/(\d{1,2})\s*(يناير|فبراير|مارس|ابريل|مايو|يونيو|يوليو|اغسطس|سبتمبر|اكتوبر|نوفمبر|ديسمبر)/);
  if(mn||md){const day=+(mn?mn[1]:md[1]),mon=mn?MONTHS[mn[2]]:+md[2];if(day>=1&&day<=31&&mon>=1&&mon<=12)date=new Date(now.getFullYear(),mon-1,day)}
  if(!date)for(const [re,wd] of WD)if(re.test(t)){date=new Date();let diff=(wd-date.getDay()+7)%7;if(diff===0)diff=7;date.setDate(date.getDate()+diff);break}
 }
 if(date){out.start=isoDate(date);if(!out.kind)out.kind='sub'}
 // الملاحظة (للمستفسرات)
 if(out.kind==='inq'){const n=t.match(/(?:بتسال|بتستفسر|استفسار|عايزه تعرف)\s+(?:عن|علي|على)?\s*(.+?)\s*$/);if(n){const x=n[1].replace(/\s*,\s*/g,' ').trim();if(x.length>1)out.note=back(x)}}
 return out;
}

  const it={id:uid(),type:lt,group:lt==='ex'?$('#ng').value:'',name:n,notes:'',videos:[]};LIB.push(it);saveLib();go({v:'item',id:it.id})};
 $('#na').onclick=add;$('#nn').onkeydown=e=>{if(e.key==='Enter')add()};
 if($('#cm'))$('#cm').onclick=()=>{let c=0;for(const g in COMMON)for(const n of COMMON[g])if(!LIB.some(x=>x.type==='ex'&&normAr(x.name)===normAr(n))){LIB.push({id:uid(),type:'ex',group:g,name:n,notes:'',videos:[]});c++}saveLib();toast(c?'اتضاف '+c+' تمرين ✓':'كلهم موجودين');lib()};
}
async function item(){
 const it=LIB.find(x=>x.id===view.id);if(!it){history.back();return}
 it.videos=it.videos||[];
 $('#app').innerHTML=`
 <div class="hdr"><div class="row"><button class="back" onclick="history.back()">→</button><h1>${it.type==='eq'?'🏋️ جهاز':'🤸 تمرين'}</h1></div></div>
 <main>
 <div class="lbl" style="margin-top:0">الاسم</div><input class="inp" id="i-name" value="${esc(it.name)}">
 ${it.type==='ex'?`<div class="lbl">المجموعة</div><select class="inp" id="i-group">${[...GROUPS,...(GROUPS.includes(it.group)||!it.group?[]:[it.group])].map(g=>`<option ${g===it.group?'selected':''}>${esc(g)}</option>`).join('')}</select>`:''}
 <div class="lbl">وصف / ملاحظات</div><textarea class="inp" id="i-notes" style="min-height:90px" placeholder="طريقة الاستخدام، العدّات، تنبيهات...">${esc(it.notes)}</textarea>
 <div class="lbl">الفيديوهات</div><div id="vd"></div>
 <button class="btn sec" id="addv" style="margin-top:0">🎬 فيديو من الموبايل (تصوير أو معرض)</button>
 <button class="btn sec" id="addl">🔗 لينك فيديو (يوتيوب أو غيره)</button>
 <input type="file" id="fv" accept="video/*" multiple hidden>
 <button class="btn" id="ok">✓ تمام</button>
 <button class="btn del" id="dl">🗑 امسح ${it.type==='eq'?'الجهاز':'التمرين'}</button>
 </main>`;
 let tm;const flush=()=>{clearTimeout(tm);const n=$('#i-name').value.trim();if(n)it.name=n;it.notes=$('#i-notes').value;if($('#i-group'))it.group=$('#i-group').value;saveLib()};
 const auto=()=>{clearTimeout(tm);tm=setTimeout(flush,300)};
 $('#i-name').oninput=auto;$('#i-notes').oninput=auto;if($('#i-group'))$('#i-group').onchange=auto;
 const drawV=async()=>{
  const box=$('#vd');if(!box)return;box.innerHTML='';
  const site=SITE_VIDEOS[it.name];
  if(site){const d=document.createElement('div');d.className='vid';d.innerHTML=`<video controls playsinline preload="metadata" src="${site}" style="width:100%;border-radius:10px;background:#000;display:block;max-height:70vh"></video><div class="pr" style="margin:6px 2px 0">🎬 فيديو الموقع (بيشتغل من غير ما تحمّله)</div>`;box.appendChild(d)}
  if(!it.videos.length&&!site)box.innerHTML='<div class="pr" style="margin-bottom:8px">لسه مفيش فيديو</div>';
  for(const v of it.videos){
   const d=document.createElement('div');d.className='vid';
   if(v.kind==='file'){const b=await idbGet(v.id);if(b){const e=document.createElement('video');e.controls=true;e.playsInline=true;e.preload='metadata';e.src=URL.createObjectURL(b);d.appendChild(e)}else d.textContent='الفيديو مش موجود على الموبايل ده'}
   else{const em=ytEmbed(v.url);if(em){const f=document.createElement('iframe');f.src=em;f.allowFullscreen=true;f.setAttribute('allow','accelerometer; autoplay; encrypted-media; picture-in-picture');d.appendChild(f)}
    else{const a=document.createElement('a');a.className='btn sec';a.href=v.url;a.target='_blank';a.textContent='▶ افتح الفيديو';a.style.marginTop='0';d.appendChild(a)}}
   const x=document.createElement('button');x.className='vx';x.textContent='🗑 مسح الفيديو';
   x.onclick=async()=>{if(!confirm('تمسح الفيديو ده؟'))return;it.videos=it.videos.filter(y=>y!==v);saveLib();if(v.kind==='file')try{await idbDel(v.id)}catch(e){}drawV()};
   d.appendChild(x);box.appendChild(d);
  }
 };
 drawV();
 $('#addv').onclick=()=>$('#fv').click();
 $('#fv').onchange=async e=>{
  const fs=[...e.target.files];e.target.value='';let ok=0;
  for(const f of fs){
   if(f.size>80*1048576&&!confirm('الفيديو ده كبير ('+Math.round(f.size/1048576)+' ميجا) وهياخد مساحة من الموبايل. تكمل؟'))continue;
   try{const id='v'+uid();toast('بحفظ الفيديو...');await idbPut(id,f);it.videos.push({id,kind:'file',name:f.name});saveLib();ok++}catch(err){toast('الفيديو ماتحفظش، يمكن المساحة مش كفاية')}
  }
  if(ok)toast('اتحفظ '+ok+' فيديو ✓');drawV();
 };
 $('#addl').onclick=()=>{const u=(prompt('الصق لينك الفيديو هنا:')||'').trim();if(!u)return;
  try{new URL(u)}catch(e){toast('اللينك ده مش صح');return}
  it.videos.push({id:'l'+uid(),kind:'link',url:u});saveLib();toast('اتضاف ✓');drawV()};
 $('#ok').onclick=()=>{flush();toast('اتحفظ ✓');history.back()};
 $('#dl').onclick=async()=>{if(!confirm('متأكد إنك عايز تمسح "'+it.name+'" وفيديوهاته؟'))return;
  for(const v of it.videos)if(v.kind==='file')try{await idbDel(v.id)}catch(e){}
  LIB=LIB.filter(x=>x!==it);saveLib();for(const n in PG)if(PG[n]&&PG[n].ex)PG[n].ex=PG[n].ex.filter(i=>i!==it.id);savePG();toast('اتمسح');history.back()};
}

// ===== النسخة الاحتياطية =====
function backup(){
 const last=+localStorage.getItem('gy_last_backup')||0;
 const ni=Object.values(PG).reduce((a,g)=>a+((g&&g.imgs)||[]).length,0);
 $('#app').innerHTML=`
 <div class="hdr"><div class="row"><button class="back" onclick="history.back()">→</button><h1>💾 النسخة الاحتياطية</h1></div></div>
 <main>
 <div class="card"><b>البيانات محفوظة على التليفون ده بس.</b><div class="pr" style="margin-top:6px">عشان ماتضيعش لو التليفون ضاع أو اتمسح، اعمل نسخة كل أسبوع وابعتها لنفسك على الواتساب أو احفظها على Google Drive. النسخة فيها المشتركات وبرامج الكابتن وصورها وأسماء الأجهزة والتمارين ولينكات الفيديو. <b>فيديوهات الموبايل اللي رفعتها جوه التطبيق مش داخلة في النسخة</b>، فاحتفظ بيها في معرض الصور.</div>
 <div class="pr" style="margin-top:6px">المشتركات والاستفسارات: <b>${DB.length}</b> · صور البرامج: <b>${ni}</b> · آخر نسخة: <b>${last?new Date(last).toLocaleDateString('ar-EG'):'لسه'}</b></div></div>
 <button class="btn" id="ex">⬆ اعمل نسخة احتياطية دلوقتي</button>
 <button class="btn sec" id="im">⬇ رجّع نسخة قديمة</button>
 <input type="file" id="fi" accept=".json,application/json" hidden>
 </main>`;
 $('#ex').onclick=async()=>{
  try{
   toast('بجهّز النسخة...');
   const images={};
   for(const g of Object.values(PG))for(const id of (g.imgs||[])){const b=await idbGet(id);if(b)images[id]=await blob2url(b)}
   const name='women-health-gym-'+todayISO()+'.json';
   const blob=new Blob([JSON.stringify({app:'women-health-gym',v:1,at:Date.now(),plan20:true,members:DB,programs:PG,prices:PR,images,lib:LIB.map(x=>({...x,videos:(x.videos||[]).filter(v=>v.kind==='link')}))},null,1)],{type:'application/json'});
   const file=new File([blob],name,{type:'application/json'});
   if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:name});
   else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
   localStorage.setItem('gy_last_backup',Date.now());toast('النسخة اتعملت ✓');backup();
  }catch(e){if(e.name!=='AbortError')toast('ماتعملتش، جرّب تاني')}
 };
 $('#im').onclick=()=>$('#fi').click();
 $('#fi').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
   const j=JSON.parse(await f.text());const mem=Array.isArray(j.members)?j.members:null;if(!mem)throw 0;
   if(!confirm('النسخة فيها '+mem.length+' مشتركة/استفسار. هتتضاف على اللي موجود (والمكرر هيتحدّث). تكمل؟'))return;
   const m=new Map(DB.map(p=>[p.id,p]));mem.forEach(p=>p&&p.id&&m.set(p.id,p));DB=[...m.values()];save();
   const imgs=j.images||{};for(const id in imgs){const b=await (await fetch(imgs[id])).blob();await idbPut(id,b)}
   if(j.plan20)for(const n in (j.programs||{})){const g=j.programs[n];if(g&&(g.title||g.notes||(g.imgs&&g.imgs.length)))PG[n]=g}
   savePG();Object.assign(PR,j.prices||{});savePR();
   if(Array.isArray(j.lib)){for(const x of j.lib){if(!x||!x.id)continue;const o=LIB.find(y=>y.id===x.id);if(!o)LIB.push({...x,videos:x.videos||[]});else{o.name=x.name;o.notes=x.notes;o.group=x.group;for(const v of (x.videos||[]))if(!o.videos.some(y=>y.id===v.id))o.videos.push(v)}}saveLib()}
   toast('اترجعت ✓');go({v:'home'});
  }catch(err){toast('الملف ده مش نسخة صحيحة')}
 };
}

render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
