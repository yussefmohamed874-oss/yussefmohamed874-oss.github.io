<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>تطبيقي · Women Health GYM</title>

<style>
:root{--navy:#0B1A4A;--purple:#5B1FA8;--gold:#FFD400;--bg:#F4F3EE;--card:#fff;--ink:#141413;--mut:#6b6a63;--line:#E8E6DC;--red:#D92D20;--green:#0E9F6E;--amber:#D97706;--wa:#25D366;--pink:#BE185D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Zain,Tahoma,sans-serif;color:var(--ink);font-size:18px;min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom) + 86px)}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.hdr{background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 16px 18px;position:sticky;top:0;z-index:5}
.hdr h1{font-size:25px;font-weight:900;line-height:1.2}
.hdr .sub{font-size:14px;opacity:.85}
.search{width:100%;border:0;border-radius:14px;padding:11px 14px;font-size:17px;margin-top:12px;background:#fff;color:var(--ink);outline:none}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ct{font-size:19px;font-weight:900;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ct .r{margin-inline-start:auto;font-size:14px;font-weight:800;color:var(--purple)}
.pr{color:var(--mut);font-size:16px;line-height:1.55}
.big{font-size:40px;font-weight:900;line-height:1}
.badge{font-size:14px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap;display:inline-block}
.b-act{background:#E3F6EC;color:#0E7A50}.b-soon{background:#FFF1D6;color:#B45309}.b-exp{background:#FDE7E5;color:#B42318}.b-none{background:#eee;color:#777}
.bar{height:12px;background:var(--line);border-radius:10px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--pink))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:#F7F4FC;border-radius:14px;padding:10px 4px;text-align:center}
.st b{display:block;font-size:24px;font-weight:900;color:var(--navy);line-height:1.1}
.st span{font-size:13px;color:var(--mut);font-weight:700}
.st em{display:block;font-style:normal;font-size:13px;font-weight:800;margin-top:2px}
.up{color:var(--red)}.down{color:var(--green)}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;text-align:center;border-radius:14px;padding:13px;font-weight:900;font-size:18px;margin-top:10px;text-decoration:none}
.btn.wa{background:var(--wa)}.btn.sec{background:#eee;color:#333;font-size:16px;padding:11px}.btn.gold{background:var(--gold);color:var(--navy)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:15px}
.chip.on{border-color:var(--purple);background:#F1EAFB;color:var(--purple)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:9}
.nav button{flex:1;text-align:center;font-size:12px;font-weight:800;color:var(--mut);padding:4px 0}
.nav button i{display:block;font-style:normal;font-size:22px;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--purple)}.nav button.on i{filter:none;opacity:1}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 96px);left:50%;transform:translateX(-50%);background:var(--navy);color:var(--gold);padding:10px 18px;border-radius:14px;font-weight:800;z-index:50;max-width:90vw;text-align:center}
.pl{font-size:16px;line-height:1.75}
.pl .h{font-weight:900;color:var(--navy);margin-top:10px}
.pl .li{padding-right:6px}
.vid video{width:100%;border-radius:12px;background:#000;display:block;max-height:62vh}
.ex{margin-top:10px;background:#F7F4FC;border-radius:12px;padding:8px 12px}
.ex summary{font-weight:900;color:var(--purple);font-size:16px;cursor:pointer;padding:2px 0}
.exb{font-size:15.5px;line-height:1.65;margin-top:7px}.exb b{color:var(--navy)}
.exb ol,.exb ul{margin:3px 22px 0 0}
.exb.tip{background:#FFF6CC;border-radius:10px;padding:7px 10px}
.cls{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--line);border-radius:14px;margin-top:8px;width:100%;text-align:right;background:#fff}
.cls.on{border-color:var(--purple);background:#F1EAFB}
.cls .tm{min-width:62px;text-align:center;font-weight:900;color:var(--navy)}
.cls .ck{margin-inline-start:auto;font-size:22px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.dots span{width:22px;height:22px;border-radius:7px;background:var(--line);display:grid;place-items:center;font-size:11px;color:#999;font-weight:800}
.dots span.y{background:var(--green);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#F1EAFB;color:var(--purple);padding:6px 3px;font-weight:800}
td{border-bottom:1px solid var(--line);padding:6px 3px;text-align:center}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.kv span{color:var(--mut)}.kv b{font-weight:800;text-align:left}
.hello{background:linear-gradient(135deg,#FCE7F3,#F1EAFB);border-radius:18px;padding:14px;margin-bottom:12px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.logo{width:96px;height:96px;border-radius:26px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:38px;font-weight:900;margin:20px auto 14px}
</style>
</head>

<script>
const SITE_VIDEOS={'تريدميل (جهاز المشي)':'videos/treadmill.mp4','عجل (بايسكل)':'videos/bike.mp4','أوربتراك (إليبتيكال)':'videos/elliptical.mp4','الكريزي (Crazy Fit)':'videos/crazyfit.mp4','سحب أمامي':'videos/lat-pulldown.mp4','سحب خلفي':'videos/seated-row.mp4','ليج بريس':'videos/leg-press.mp4','فراشة':'videos/butterfly.mp4','سوبرمان':'videos/superman.mp4','بيرد دوج':'videos/bird-dog.mp4','كرانش':'videos/crunch.mp4','ريفرس كرانش':'videos/reverse-crunch.mp4','بايسكل كرانش':'videos/bicycle-crunch.mp4','ليج ريز':'videos/leg-raise.mp4','بلانك على الكوعين':'videos/forearm-plank.mp4','بلانك جانبي':'videos/side-plank.mp4','بلانك لمس الكتف':'videos/shoulder-tap-plank.mp4','ضغط على الركبة':'videos/knee-pushup.mp4','جلوت بريدج':'videos/glute-bridge.mp4','دونكي كيك':'videos/donkey-kick.mp4','كلام شيل':'videos/clamshell.mp4','فاير هايدرانت':'videos/fire-hydrant.mp4','سايد ليج ريز':'videos/side-leg-raise.mp4','بايسبس كيرل بدمبل':'videos/biceps-curl.mp4','إطالة الفخذ الأمامي':'videos/front-thigh-stretch.mp4','إطالة الفخذ الخلفي':'videos/back-thigh-stretch.mp4','جامبينج جاك':'videos/jumping-jacks.mp4','ركبة عالية':'videos/high-knees.mp4','إطالة الأرداف':'videos/glute-stretch.mp4','إطالة الصدر والأكتاف':'videos/chest-shoulder-stretch.mp4','تنفس عميق':'videos/deep-breathing.mp4','سكوات بوزن الجسم':'videos/squat.mp4','ماونتن كلايمبر':'videos/mountain-climber.mp4','روسيان تويست':'videos/russian-twist.mp4','إطالة الظهر (وضعية الطفل)':'videos/child-pose.mp4','إطالة الظهر العلوي (عناق الذراعين)':'videos/upper-back-stretch.mp4','كيك باك ترايسبس بدمبل':'videos/triceps-kickback.mp4','دبس':'videos/bench-dips.mp4'};
const EXPL={"تريدميل (جهاز المشي)": {"m": "القلب والرئة، والرجلين (الفخذ والسمانة والأرداف)، وبيحرق سعرات.", "s": ["اطلعي على جانبي الجهاز قبل ما تشغّليه، وابدئي بسرعة بطيئة (3 لـ 4 كم/س).", "زوّدي السرعة بالتدريج لحد مشي سريع (5 لـ 6 كم/س)، ولو البرنامج فيه ميل خليه من 2 لـ 5%.", "خلي ضهرك مفرود وبصي قدامك، والدراعين بيتحركوا طبيعي جنبك.", "الخطوة: الكعب الأول وبعدين المشط، ومتتشبطيش في المقابض.", "في الآخر قللي السرعة بالتدريج دقيقتين قبل ما توقفي."], "b": "نفس منتظم. لو مش قادرة تقولي جملة كاملة وانتي ماشية، يبقى السرعة عالية عليكي.", "e": ["مسك المقابض طول الوقت.", "البص في الأرض أو في الموبايل.", "خطوات طويلة زيادة عن اللزوم.", "النزول من الجهاز وهو شغال."], "t": "اربطي كليب الأمان في هدومك. ولو حسيتي بدوخة أو ألم في الصدر، وقفي فورًا."}, "عجل (بايسكل)": {"m": "القلب والرئة، والفخذ الأمامي والخلفي، والأرداف، والسمانة.", "s": ["اضبطي الكرسي: لما الدواسة تبقى تحت، الركبة تبقى شبه مفرودة بثنية بسيطة.", "اقعدي وضهرك مفرود، وإيديك على المقبض من غير ما تتسندي عليه بقوة.", "ابدئي بمقاومة خفيفة من 3 لـ 5 دقايق.", "بدّلي بانتظام، وادفعي بمشط القدم.", "زوّدي المقاومة على حسب البرنامج."], "b": "نفس هادي ومنتظم مع إيقاع البدال.", "e": ["كرسي واطي جدًا (بيتعب الركبة) أو عالي جدًا (الحوض بيتمايل).", "تقويس الضهر لقدام.", "مقاومة عالية من أول دقيقة."], "t": "مناسب مع آلام الركبة الخفيفة لو المقاومة خفيفة، بس بعد ما تسألي الكابتن."}, "أوربتراك (إليبتيكال)": {"m": "الجسم كامل: الرجلين، والأرداف، والدراعين، والضهر. وبيحرق سعرات من غير خبط على المفاصل.", "s": ["اطلعي على الدواسات وامسكي المقابض المتحركة.", "ابدئي حركة الرجلين ببطء في شكل بيضاوي.", "ادفعي واسحبي المقابض مع حركة الرجلين.", "خلي جسمك مفرود وبطنك مشدودة.", "زوّدي المقاومة بالتدريج."], "b": "نفس منتظم.", "e": ["الميل لقدام والاتكاء على المقابض.", "الوقوف على أطراف الصوابع.", "سرعة عالية مع مقاومة ضعيفة جدًا."], "t": "ممتاز للي عندها وزن زيادة أو آلام في المفاصل، لأنه من غير خبط."}, "الكريزي (Crazy Fit)": {"m": "تنشيط الدورة الدموية، والرجلين، والأرداف، وعضلات الثبات (الكور).", "s": ["اطلعي على الجهاز وهو مقفول وامسكي function b64uToU8(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function decode(s){
 if(s[0]==='z'){const txt=await new Response(new Blob([b64uToU8(s.slice(1))]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();return JSON.parse(txt)}
 if(s[0]==='p')return JSON.parse(new TextDecoder().decode(b64uToU8(s.slice(1))));
 throw new Error('bad');
}

}

function stepsHTML(){const f=follow();if(!f||!f.steps.length)return '';
 return `<div class="pr" style="margin-top:6px"><b>تقدّمك من متابعة للتانية:</b></div>`+f.steps.map(x=>`<div class="kv"><span>${fmtD(x.r.date)} · بعد ${dayWord(x.days)} · ${srcIcon(x.r)}</span><b class="${(M().goal==='زيادة وزن'?x.diff>0:x.diff<0)?'down':x.diff===0?'':'up'}">${x.diff>0?'+':''}${x.diff} كجم</b></div>`).join('')}
async function drawPhotos(){const box=$('#phs'),cmp=$('#cmp');if(!box)return;box.innerHTML='';cmp.innerHTML='';
 const list=[...PH].sort((a,b)=>a.date<b.date?-1:1);const urls={};
 for(const p of list){const bl=await idbGet(p.id);if(!bl)continue;urls[p.id]=URL.createObjectURL(bl);
  const d=document.createElement('div');d.style.cssText='position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#ddd';
  d.innerHTML=`<img src="${urls[p.id]}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;text-align:center">${fmtD(p.date)}</div><button style="position:absolute;top:4px;left:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:26px;height:26px">✕</button>`;
  d.querySelector('button').onclick=async()=>{if(!confirm('تمسحي الصورة دي؟'))return;PH=PH.filter(x=>x.id!==p.id);savePH();await idbDel(p.id);drawPhotos()};box.appendChild(d)}
 const ok=list.filter(p=>urls[p.id]);if(ok.length>=2){const a=ok[0],b=ok[ok.length-1];
  cmp.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">${[[a,'قبل'],[b,'بعد']].map(([p,l])=>`<div><img src="${urls[p.id]}" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px"><div style="text-align:center;font-weight:800">${l} · ${fmtD(p.date)}</div></div>`).join('')}</div>`}}

// ---------- البداية ----------
(async()=>{
 const mt=location.hash.match(/[#&]d=([^&]+)/);
 if(mt){try{const d=await decode(mt[1]);if(!d||!d.m)throw 0;D=d;localStorage.setItem(KEY,JSON.stringify(d));history.replaceState(null,'',location.pathname);setTimeout(()=>toast('أهلاً يا '+((d.m.name||'').split(' ')[0])+' 🌸 اتحدّثت بياناتك'),300)}
  catch(e){setTimeout(()=>toast('الرابط ده مش شغال. اطلبي رابط جديد من كابتن هبة'),300)}}
 render();
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
